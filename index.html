<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>심플 계산기</title>
    <style>
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            background-color: #f4f4f9;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .calculator {
            background-color: #333;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
            width: 350px; /* 너비 확장 */
        }

        #display {
            width: 100%;
            height: 70px;
            font-size: 2.5rem; /* 기본 폰트 크기 */
            text-align: right;
            margin-bottom: 20px;
            padding: 10px;
            box-sizing: border-box;
            border: none;
            border-radius: 5px;
            background-color: #eee;
            color: #333;
            transition: font-size 0.2s; /* 부드러운 변화 */
        }

        .buttons {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 10px;
        }

        button {
            padding: 20px;
            font-size: 1.2rem;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.2s;
            background-color: #555;
            color: white;
        }

        button:hover {
            background-color: #777;
        }

        .operator {
            background-color: #f39c12;
        }

        .operator:hover {
            background-color: #e67e22;
        }

        .equal {
            background-color: #27ae60;
            grid-column: span 2;
        }

        .equal:hover {
            background-color: #2ecc71;
        }

        .clear {
            background-color: #c0392b;
            grid-column: span 2;
        }

        .clear:hover {
            background-color: #e74c3c;
        }
    </style>
</head>
<body>

<div class="calculator">
    <input type="text" id="display" disabled value="0">
    <div class="buttons">
        <button class="clear" onclick="clearDisplay()">C</button>
        <button class="operator" onclick="appendToDisplay('/')">/</button>
        <button class="operator" onclick="appendToDisplay('*')">×</button>
        
        <button onclick="appendToDisplay('7')">7</button>
        <button onclick="appendToDisplay('8')">8</button>
        <button onclick="appendToDisplay('9')">9</button>
        <button class="operator" onclick="appendToDisplay('-')">-</button>
        
        <button onclick="appendToDisplay('4')">4</button>
        <button onclick="appendToDisplay('5')">5</button>
        <button onclick="appendToDisplay('6')">6</button>
        <button class="operator" onclick="appendToDisplay('+')">+</button>
        
        <button onclick="appendToDisplay('1')">1</button>
        <button onclick="appendToDisplay('2')">2</button>
        <button onclick="appendToDisplay('3')">3</button>
        <button class="equal" onclick="calculate()">=</button>
        
        <button onclick="appendToDisplay('0')" style="grid-column: span 2;">0</button>
        <button onclick="appendToDisplay('.')">.</button>
    </div>
</div>

<script>
    const display = document.getElementById('display');

    // 숫자의 길이에 따라 폰트 크기를 조절하는 함수
    function updateFontSize() {
        const length = display.value.length;
        if (length > 16) {
            display.style.fontSize = "1.2rem";
        } else if (length > 12) {
            display.style.fontSize = "1.6rem";
        } else if (length > 8) {
            display.style.fontSize = "2.0rem";
        } else {
            display.style.fontSize = "2.5rem";
        }
    }

    function appendToDisplay(input) {
        if (display.value === "0" && !isNaN(input)) {
            display.value = input;
        } else {
            display.value += input;
        }
        updateFontSize();
    }

    function clearDisplay() {
        display.value = "0";
        updateFontSize();
    }

    function calculate() {
        try {
            let result = eval(display.value);
            
            // 소수점 자리수 제한 (부동소수점 오차 방지)
            if (!Number.isInteger(result)) {
                result = Number(result.toFixed(8));
            }
            
            display.value = result;
            updateFontSize();
        } catch (error) {
            display.value = "Error";
            setTimeout(clearDisplay, 1500);
        }
    }
</script>

</body>
</html>
